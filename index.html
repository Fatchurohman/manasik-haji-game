<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Strategi Manasik Haji</title>
    <!-- Menggunakan Tailwind CSS untuk styling cepat dan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div id="game-app" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
        
        <!-- HEADER / TITLE -->
        <div class="bg-gradient-to-r from-emerald-900 to-teal-900 p-5 text-center border-b border-emerald-800">
            <h1 class="text-xl font-bold tracking-wide text-emerald-100">🕋 Game Manasik Haji</h1>
            <p class="text-xs text-emerald-300 mt-1">Petualangan Edukasi Perjalanan Suci</p>
        </div>

        <!-- AREA KONTEN UTAMA -->
        <div id="main-content" class="p-6 flex-1 flex flex-col justify-center">
            <!-- Konten akan di-render dinamis oleh JavaScript -->
        </div>

        <!-- FOOTER INFO -->
        <div class="bg-slate-950 px-5 py-3 text-center border-t border-slate-800 text-xs text-slate-500">
            Keluarga Besar Fatchurohman &bull; Edisi Mobile
        </div>
    </div>

    <script>
        // State Game Utama
        const state = {
            playerName: "Jemaah Haji",
            playerGender: "Pria",
            score: 0,
            energy: 100,
            currentStage: 0
        };

        // Daftar Tahapan Manasik
        const stages = [
            {
                title: "Tahap 1: Miqat & Ihram",
                desc: "Anda tiba di batas miqat. Langkah awal apa yang akan Anda lakukan sebelum mengenakan kain ihram?",
                choices: [
                    { text: "Mandi sunnah, wudhu, shalat sunnah ihram, lalu berniat haji", score: 25, energy: 0, feedback: "Sempurna! Niat dan sunnah miqat dikerjakan dengan tertib." },
                    { text: "Langsung berniat di dalam bus tanpa mandi karena terburu-buru", score: 10, energy: -10, feedback: "Sah, namun Anda melewatkan kesunnahannya." }
                ]
            },
            {
                title: "Tahap 2: Tiba di Makkah & Tawaf Qudum",
                desc: "Sesampainya di Masjidil Haram, Anda bersiap melaksanakan Tawaf Qudum mengelilingi Ka'bah sebanyak 7 putaran.",
                choices: [
                    { text: "Tawaf dengan khusyuk, menjaga wudhu, dan terus berdzikir", score: 30, energy: -20, feedback: "Luar biasa! Hati menjadi tenang dan tawaf selesai sempurna." },
                    { text: "Berdesak-desakan dan berlari kecil tanpa mempedulikan jemaah lain", score: 15, energy: -40, feedback: "Anda berhasil, namun fisik sangat kelelahan." }
                ]
            },
            {
                title: "Tahap 3: Sa'i (Safa ke Marwah)",
                desc: "Perjalanan Sa'i dimulai dari bukit Safa menuju Marwah sebanyak 7 kali perjalanan.",
                choices: [
                    { text: "Berjalan stabil, berlari kecil di area lampu hijau, minum air Zamzam secukupnya", score: 30, energy: -25, feedback: "Energi terjaga dengan baik sepanjang rute Sa'i." },
                    { text: "Memaksakan lari terus menerus di awal perjalanan", score: 10, energy: -55, feedback: "Kram otot! Anda kehabisan tenaga di tengah jalan." }
                ]
            },
            {
                title: "Tahap 4: Puncak Wukuf di Arafah",
                desc: "Waktu wukuf di Arafah telah tiba. Inilah inti dari ibadah haji.",
                choices: [
                    { text: "Memperbanyak doa, istighfar, dzikir, dan mendengarkan khutbah wukuf", score: 40, energy: -10, feedback: "Mabrur! Anda memanfaatkan waktu wukuf dengan kekhusyukan maksimal." },
                    { text: "Banyak tidur di dalam tenda dan mengobrol bersama teman", score: 5, energy: 0, feedback: "Sayang sekali, Anda melewatkan keutamaan besar di Arafah." }
                ]
            }
        ];

        // 1. TAMPILAN AWAL (PROFIL & KARAKTER)
        function renderWelcome() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nama Jemaah</label>
                        <input type="text" id="input-name" value="${state.playerName}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Pilih Karakter</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="setGender('Pria', this)" id="btn-pria" class="gender-btn p-3 rounded-xl border ${state.playerGender === 'Pria' ? 'bg-emerald-900/40 border-emerald-500 text-emerald-200' : 'bg-slate-800 border-slate-700 text-slate-400'} text-sm font-semibold transition">🧕 Jemaah Pria (Ihram)</button>
                            <button onclick="setGender('Wanita', this)" id="btn-wanita" class="gender-btn p-3 rounded-xl border ${state.playerGender === 'Wanita' ? 'bg-emerald-900/40 border-emerald-500 text-emerald-200' : 'bg-slate-800 border-slate-700 text-slate-400'} text-sm font-semibold transition">🧕 Jemaah Wanita</button>
                        </div>
                    </div>
                    <button onclick="startGame()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-emerald-900/30 transition">
                        Mulai Perjalanan Haji 🚀
                    </button>
                </div>
            `;
        }

        function setGender(gender, btnElement) {
            state.playerGender = gender;
            document.querySelectorAll('.gender-btn').forEach(b => {
                b.className = "gender-btn p-3 rounded-xl border bg-slate-800 border-slate-700 text-slate-400 text-sm font-semibold transition";
            });
            btnElement.className = "gender-btn p-3 rounded-xl border bg-emerald-900/40 border-emerald-500 text-emerald-200 text-sm font-semibold transition";
        }

        function startGame() {
            const nameInput = document.getElementById('input-name');
            if (nameInput && nameInput.value.trim() !== "") {
                state.playerName = nameInput.value.trim();
            }
            state.score = 0;
            state.energy = 100;
            state.currentStage = 0;
            renderStage();
        }

        // 2. TAMPILAN GAMEPLAY (TAHAPAN)
        function renderStage() {
            if (state.currentStage >= stages.length || state.energy <= 0) {
                renderResult();
                return;
            }

            const stage = stages[state.currentStage];
            const container = document.getElementById('main-content');

            container.innerHTML = `
                <!-- Status Bar -->
                <div class="flex justify-between items-center bg-slate-800/60 border border-slate-700/50 p-3 rounded-xl mb-4 text-xs">
                    <span class="text-slate-300">Jemaah: <strong class="text-emerald-400">${state.playerName}</strong></span>
                    <span class="text-slate-300">Poin: <strong class="text-amber-400">${state.score}</strong></span>
                    <span class="text-slate-300">Energi: <strong class="${state.energy < 30 ? 'text-rose-400' : 'text-teal-400'}">${state.energy}%</strong></span>
                </div>

                <!-- Kartu Quest -->
                <div class="space-y-4">
                    <div>
                        <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Tahap ${state.currentStage + 1} dari ${stages.length}</span>
                        <h2 class="text-lg font-bold text-white mt-1">${stage.title}</h2>
                        <p class="text-sm text-slate-300 mt-2 leading-relaxed">${stage.desc}</p>
                    </div>

                    <div class="space-y-2 pt-2">
                        ${stage.choices.map((choice, index) => `
                            <button onclick="handleChoice(${index})" class="w-full text-left bg-slate-800 hover:bg-slate-750 border border-slate-700/80 p-3.5 rounded-xl text-sm text-slate-200 transition active:scale-[0.98]">
                                <span class="font-bold text-emerald-400 mr-1">${index + 1}.</span>${choice.text}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function handleChoice(choiceIndex) {
            const stage = stages[state.currentStage];
            const choice = stage.choices[choiceIndex];

            state.score += choice.score;
            state.energy += choice.energy;
            if (state.energy < 0) state.energy = 0;

            // Tampilkan umpan balik singkat
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="text-center space-y-4 py-6">
                    <div class="inline-flex p-3 bg-emerald-900/40 border border-emerald-500/50 rounded-full text-emerald-400 text-xl">💡</div>
                    <h3 class="text-base font-bold text-white">Catatan Perjalanan</h3>
                    <p class="text-sm text-slate-300 px-4">${choice.feedback}</p>
                    <button onclick="nextStage()" class="mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-3 rounded-xl text-sm transition">
                        Lanjutkan Perjalanan ➔
                    </button>
                </div>
            `;
        }

        function nextStage() {
            state.currentStage++;
            renderStage();
        }

        // 3. TAMPILAN SELESAI (HASIL AKHIR)
        function renderResult() {
            const container = document.getElementById('main-content');
            let predicate = "Haji Mabrur & Mandiri";
            if (state.score < 80) predicate = "Perlu Memperdalam Ilmu Manasik";

            container.innerHTML = `
                <div class="text-center space-y-4 py-4">
                    <div class="text-4xl">🎉</div>
                    <h2 class="text-xl font-bold text-white">Manasik Selesai!</h2>
                    <p class="text-xs text-slate-400">Alhamdulillah, rangkaian simulasi perjalanan haji telah Anda lewati.</p>
                    
                    <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl space-y-2 text-left text-sm">
                        <div class="flex justify-between"><span class="text-slate-400">Nama:</span> <strong class="text-white">${state.playerName}</strong></div>
                        <div class="flex justify-between"><span class="text-slate-400">Total Poin:</span> <strong class="text-amber-400">${state.score}</strong></div>
                        <div class="flex justify-between"><span class="text-slate-400">Predikat:</span> <strong class="text-emerald-400">${predicate}</strong></div>
                    </div>

                    <button onclick="renderWelcome()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-xl text-sm transition">
                        Main Lagi 🔄
                    </button>
                </div>
            `;
        }

        // Jalankan halaman awal saat pertama dibuka
        renderWelcome();
    </script>
</body>
</html>
